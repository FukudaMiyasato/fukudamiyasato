<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enviar orden — test</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/test.css">
</head>
<body>

<a class="back-btn" href="/index.html" aria-label="Volver al inicio">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 5.5L8 12l6.5 6.5"/>
  </svg>
</a>

<main class="page">

  <div class="page-head">
    <p class="page-sub">Test &middot; Enviar orden</p>
  </div>

  <form class="order-form" id="order-form">
    <label for="order-key">Clave</label>
    <input type="password" id="order-key" name="key" autocomplete="off" required>

    <label for="order-text">Texto a ejecutar</label>
    <textarea id="order-text" name="text" placeholder="Escribe la instrucción, como si la hubieras dicho en voz alta..." required></textarea>

    <button type="submit" id="order-submit">Enviar</button>
    <button type="button" id="order-mock" class="order-mock-btn">Probar gratis</button>
    <p class="order-note" id="order-note" role="status"></p>
  </form>

</main>

<script type="module" src="/js/test-send-order.js"></script>
</body>
</html>
