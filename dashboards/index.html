<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — fukudamiyasato</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/modal.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<!-- Una sola página para todos los dashboards: /dashboards/?d=<id> -->
<body class="board-body">

<main class="gate-screen" id="v-loading">
  <p class="gate-note">Cargando…</p>
</main>

<main class="gate-screen" id="v-denied" hidden>
  <div class="gate-card">
    <p class="kicker">Acceso</p>
    <h1>No tienes permisos</h1>
    <p class="gate-note" id="denied-msg">Tu cuenta no tiene acceso a este dashboard.</p>
    <a class="ghost-btn" href="/admin/" style="display:inline-block">Volver</a>
  </div>
</main>

<div class="board-app" id="v-dash" hidden>
  <header class="board-top">
    <a class="exit" href="/admin/" id="dash-back" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      safar
    </a>
    <div class="board-head">
      <span class="dash-ico" id="dash-ico"></span>
      <div class="board-title">
        <p class="kicker">Dashboard</p>
        <h1 id="dash-title"></h1>
        <small class="dash-spent" id="dash-spent" hidden></small>
      </div>
      <!-- arriba: correo y acciones · abajo: integrantes (amos) -->
      <div class="board-side">
        <div class="dash-user">
          <!-- tokens que le quedan (amos; el amo supremo no tiene límite) -->
          <span class="tokens" id="dash-tokens" hidden title="Tokens que te quedan para la IA"></span>
          <small data-user-email></small>
          <button class="icon-btn" data-logout type="button" aria-label="Cerrar sesión" title="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
          </button>
          <!-- ⋯ (amos): editar o eliminar el dashboard -->
          <div class="dash-menu" id="dash-menu" hidden>
            <button class="icon-btn" id="dash-menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="dash-menu-pop" aria-label="Opciones del dashboard" title="Opciones">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>
            </button>
            <div class="dash-menu-pop" id="dash-menu-pop" role="menu" hidden>
              <button type="button" role="menuitem" id="dash-edit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
                Editar
              </button>
              <button type="button" role="menuitem" id="dash-templates">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.6"/><rect x="3" y="14" width="8" height="6" rx="1.6"/><rect x="13" y="14" width="8" height="6" rx="1.6"/></svg>
                Plantillas
              </button>
              <button type="button" role="menuitem" id="dash-import">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg>
                Importar archivo…
              </button>
              <button type="button" role="menuitem" id="dash-export">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M5 19.5h14"/></svg>
                Exportar
              </button>
              <button type="button" role="menuitem" class="is-danger" id="dash-delete">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"/><path d="M9 7V4h6v3"/></svg>
                Eliminar
              </button>
            </div>
          </div>
        </div>
        <div class="members" id="members" hidden>
          <button class="members-btn" id="members-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="members-panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c0-3.2 2.7-5.3 6-5.3s6 2.1 6 5.3"/><path d="M15.5 5.6a3.2 3.2 0 0 1 0 6"/><path d="M17.5 14.5c2 .6 3.5 2.3 3.5 5"/></svg>
            Integrantes <b id="members-count">0</b>
          </button>
          <div class="members-panel" id="members-panel" hidden>
            <p class="members-title">Chismosos que ven este dashboard</p>
            <ul id="members-list"></ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- lienzo: rejilla de puntos + widgets. Se arrastra para moverse. -->
  <main class="board" id="board" aria-label="Lienzo del dashboard">
    <!-- el fondo se distorsiona solo, en su canvas (fuera de .lens: no se deforma dos veces) -->
    <canvas class="dots" id="dots" aria-hidden="true"></canvas>
    <!-- todo lo de encima (líneas + widgets) se deforma con el mismo ojo de pez
         mediante un filtro SVG (js/fisheye.js → buildLensFilter) -->
    <div class="lens" id="lens">
      <!-- supersampling: la capa se pinta al doble, se deforma a esa
           resolución y se reduce a la mitad → texto y bordes sin dientes -->
      <div class="lens-ss" id="lens-ss">
        <div class="lens-in">
          <!-- líneas entre widgets conectados (debajo de los widgets) -->
          <svg class="links" id="links" aria-hidden="true"></svg>
          <div class="world" id="world"></div>
          <!-- puntos de las líneas: encima de los conectores -->
          <svg class="links links-top" id="links-top" aria-hidden="true"></svg>
        </div>
      </div>
    </div>
    <svg class="lens-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="lens-filter"></filter>
    </svg>
    <p class="board-empty" id="board-empty" hidden></p>

    <!-- info del widget seleccionado: fuera de .lens (no se deforma) -->
    <aside class="info-wrap" id="info" hidden aria-live="polite">
      <div class="info-card">
        <button class="info-x" id="info-x" type="button" aria-label="Cerrar">×</button>
        <p class="info-kind" id="info-kind"></p>
        <h2 class="info-title" id="info-title"></h2>
        <dl class="info-list" id="info-list"></dl>
      </div>
    </aside>
  </main>

  <!-- debajo de la cabecera, arriba a la derecha: banderas (si hay) y zoom -->
  <div class="view-tools">
    <div class="flags" id="flags" hidden>
      <button class="flags-btn" id="flags-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="flags-list" aria-label="Banderas" title="Banderas"></button>
      <ul class="flags-list" id="flags-list" hidden></ul>
    </div>
    <div class="zoom" role="group" aria-label="Zoom">
      <button class="zoom-btn" type="button" data-step="-1" aria-label="Alejar"><span class="zoom-minus"></span></button>
      <input class="zoom-range" id="zoom-range" type="range" min="0" max="1000" value="500" aria-label="Zoom del lienzo">
      <button class="zoom-btn" type="button" data-step="1" aria-label="Acercar"><span class="zoom-plus"></span></button>
    </div>
  </div>

  <!-- herramientas (solo admin) -->
  <nav class="dock" id="dock" aria-label="Herramientas" hidden></nav>
</div>

<div class="tip" id="tip" role="tooltip" hidden></div>

<!-- editar dashboard: título + ícono (mismo modal que «Nuevo dashboard» del panel) -->
<div class="modal-layer" id="de-layer" hidden>
  <form class="modal nd-modal" id="de-form" autocomplete="off" novalidate>
    <label class="nd-icon" id="de-icon" for="de-file" title="Ícono (opcional)">
      <span class="nd-icon-img" id="de-icon-img"></span>
      <small id="de-icon-note">Subir ícono</small>
    </label>
    <input type="file" id="de-file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
    <button class="link-btn de-clear" type="button" id="de-clear" hidden>Quitar ícono</button>
    <input class="nd-title" id="de-title" maxlength="60" placeholder="Título del dashboard" aria-label="Título">
    <p class="m-err" id="de-err" role="alert"></p>
    <div class="m-actions">
      <button class="link-btn" type="button" id="de-cancel">Cancelar</button>
      <button class="btn" type="submit" id="de-save">Guardar</button>
    </div>
  </form>
</div>

<script type="module" src="/js/dashboard.js"></script>
</body>
</html>
