<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — fukudamiyasato</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/modal.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<!-- Una sola página para todos los dashboards: /dashboards/?d=<id> -->
<body class="board-body">

<main class="gate-screen" id="v-loading">
  <p class="gate-note">Cargando…</p>
</main>

<main class="gate-screen" id="v-denied" hidden>
  <div class="gate-card">
    <p class="kicker">Acceso</p>
    <h1>No tienes permisos</h1>
    <p class="gate-note" id="denied-msg">Tu cuenta no tiene acceso a este dashboard.</p>
    <a class="ghost-btn" href="/admin/" style="display:inline-block">Volver</a>
  </div>
</main>

<div class="board-app" id="v-dash" hidden>
  <header class="board-top">
    <a class="exit" href="/admin/" id="dash-back" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      safar
    </a>
    <div class="board-head">
      <span class="dash-ico" id="dash-ico"></span>
      <div class="board-title">
        <p class="kicker">Dashboard</p>
        <h1 id="dash-title"></h1>
      </div>
      <!-- arriba: correo y acciones · abajo: integrantes (amos) -->
      <div class="board-side">
        <div class="dash-user">
          <small data-user-email></small>
          <button class="icon-btn" id="dash-delete" type="button" aria-label="Eliminar dashboard" title="Eliminar dashboard" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"/><path d="M9 7V4h6v3"/></svg>
          </button>
          <button class="icon-btn" data-logout type="button" aria-label="Cerrar sesión" title="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
          </button>
        </div>
        <div class="members" id="members" hidden>
          <button class="members-btn" id="members-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="members-panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c0-3.2 2.7-5.3 6-5.3s6 2.1 6 5.3"/><path d="M15.5 5.6a3.2 3.2 0 0 1 0 6"/><path d="M17.5 14.5c2 .6 3.5 2.3 3.5 5"/></svg>
            Integrantes <b id="members-count">0</b>
          </button>
          <div class="members-panel" id="members-panel" hidden>
            <p class="members-title">Chismosos que ven este dashboard</p>
            <ul id="members-list"></ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- lienzo: rejilla de puntos + widgets. Se arrastra para moverse. -->
  <main class="board" id="board" aria-label="Lienzo del dashboard">
    <canvas class="dots" id="dots" aria-hidden="true"></canvas>
    <div class="world" id="world"></div>
    <p class="board-empty" id="board-empty" hidden></p>
  </main>

  <!-- herramientas (solo admin) -->
  <nav class="dock" id="dock" aria-label="Herramientas" hidden></nav>
</div>

<!-- modal de la herramienta "pregúntale a la IA": CSV + pregunta -->
<div class="modal-layer" id="modal-layer" hidden>
  <form class="modal ai-modal" id="modal" autocomplete="off" novalidate>
    <label class="m-drop" id="m-drop" for="m-file">
      <span class="m-drop-ico" id="m-drop-ico"></span>
      <span><b id="m-file-name">Elige o arrastra un CSV</b><small id="m-file-meta">Máx. 2 MB</small></span>
    </label>
    <input type="file" id="m-file" accept=".csv,.tsv,.txt,text/csv" hidden aria-label="Archivo CSV">

    <textarea id="m-prompt" rows="3" maxlength="2000" placeholder="Pregunta que me aburro" aria-label="Tu pregunta"></textarea>

    <p class="m-err" id="m-err" role="alert"></p>

    <div class="m-actions">
      <button class="link-btn m-cancel" type="button" id="m-cancel">me arrepentí</button>
      <button class="btn m-ok" type="submit" id="m-ok">Apura</button>
    </div>

    <div class="m-loading" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <b>Pensando…</b>
      <small>La IA está leyendo tu archivo</small>
    </div>
  </form>
</div>

<script type="module" src="/js/dashboard.js"></script>
</body>
</html>
