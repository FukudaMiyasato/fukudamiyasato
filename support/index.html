<!DOCTYPE html>

<body data-meta="s.meta">

<a class="back-btn" href="/" aria-label="Volver al inicio" data-i18n-aria="back">

<!-- selector de idioma: el menú lo arma js/i18n.js -->
<div class="lang">
  <button class="lang-btn" id="lang-btn" type="button" aria-haspopup="true"
          aria-expanded="false" aria-controls="lang-menu" data-i18n-aria="lang" aria-label="Idioma">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/>

    </svg>
    <span id="lang-current">Español</span>

  <ul class="lang-menu" id="lang-menu" role="menu" hidden></ul>

      <a class="card" href="#faq">
        <div class="card-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.3-2.5 3.8"/><path d="M12 17.2h.01"/></svg></div>

        <p data-i18n="s.c3.d"></p>
      </a>
    </div>

      <details><summary data-i18n="s.q7"></summary><p data-i18n="s.a7"></p></details>
    </div>

    <div class="panel">
      <h2 data-i18n="s.contact.t"></h2>
      <p data-i18n="s.contact.d"></p>
      <ul>
        <li data-i18n="s.contact.l1"></li>
        <li data-i18n="s.contact.l2"></li>
