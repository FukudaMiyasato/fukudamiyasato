<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUKU — Fullstack designer</title>
<meta name="description" content="Portafolio de Jean Carlo Fukuda Miyasato, fullstack designer.">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/app-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;800&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="site site--home">

<!-- fondo: el video/imagen del proyecto con tramado (js/dither.js) -->
<canvas class="stage" id="stage" aria-hidden="true"></canvas>
<div class="stage-media" id="stage-media" hidden aria-hidden="true"></div>
<div class="stage-shade" aria-hidden="true"></div>

<a class="brand" href="/" aria-label="FUKU — inicio">
  <b>FUKU</b>
  <small>Fullstack designer</small>
</a>

<div class="top-actions">
  <button class="sound-btn" id="sound" type="button" aria-pressed="false" aria-label="Activar sonido" title="Sonido" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
      <path class="s-off" d="M16 9.5l5 5M21 9.5l-5 5"/>
      <path class="s-on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/>
    </svg>
  </button>
  <a class="login-btn" href="/admin/">login</a>
</div>

<!-- el proyecto que se ve; cambia solo cada N segundos (se ajusta en el panel) -->
<main class="folio" aria-live="polite">
  <article class="pcard" id="pcard" aria-roledescription="proyecto">
    <span class="px-shine" aria-hidden="true"></span>
    <p class="pcard-kicker fx">
      <span id="pc-index">01 / 01</span>
      <span class="pcard-line" aria-hidden="true"><i id="pc-progress"></i></span>
      <span id="pc-cat">Proyecto</span>
    </p>
    <h1 class="pcard-title fx" id="pc-title">&nbsp;</h1>
    <p class="pcard-date fx" id="pc-date"></p>
    <p class="pcard-text fx" id="pc-text"></p>
    <ul class="pcard-tags fx" id="pc-tags"></ul>
    <div class="pcard-foot fx">
      <a class="pcard-btn" id="pc-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
        Ver proyecto
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
      </a>
      <div class="pcard-nav" id="pc-nav" hidden>
        <button type="button" id="pc-prev" aria-label="Proyecto anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button type="button" id="pc-next" aria-label="Proyecto siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </article>
</main>

<!-- dock: portafolio · yo (abajo al centro) -->
<nav class="site-dock" aria-label="Secciones">
  <a href="/" aria-label="Portafolio" title="Portafolio" aria-current="page">
    <!-- maleta roja, pixel art 16×16 -->
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <g fill="#4a0510">
        <rect x="5" y="2" width="6" height="1"/><rect x="5" y="3" width="1" height="2"/><rect x="10" y="3" width="1" height="2"/>
        <rect x="1" y="5" width="14" height="10"/>
      </g>
      <rect x="2" y="6" width="12" height="8" fill="#b00c22"/>
      <rect x="2" y="6" width="12" height="5" fill="#e0102b"/>
      <rect x="2" y="6" width="12" height="2" fill="#ff5a6e"/>
      <rect x="2" y="10" width="12" height="1" fill="#8c0518"/>
      <rect x="7" y="9" width="2" height="3" fill="#4a0510"/>
      <rect x="7" y="10" width="2" height="1" fill="#ffc2c9"/>
      <rect x="3" y="7" width="3" height="1" fill="#fff" fill-opacity=".75"/>
      <rect x="2" y="13" width="12" height="1" fill="#8c0518"/>
    </svg>
  </a>
  <span class="sep" aria-hidden="true"></span>
  <a href="/yo.html" aria-label="Yo" title="Yo">
    <!-- personita, pixel art 16×16 -->
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <g fill="#4a0510">
        <rect x="6" y="0" width="4" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="10" y="1" width="1" height="1"/>
        <rect x="4" y="2" width="1" height="4"/><rect x="11" y="2" width="1" height="4"/>
        <rect x="5" y="6" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/><rect x="6" y="7" width="4" height="1"/>
        <rect x="4" y="9" width="8" height="1"/><rect x="3" y="10" width="1" height="1"/><rect x="12" y="10" width="1" height="1"/>
        <rect x="2" y="11" width="1" height="5"/><rect x="13" y="11" width="1" height="5"/><rect x="2" y="15" width="12" height="1"/>
      </g>
      <rect x="6" y="1" width="4" height="6" fill="#e0102b"/><rect x="5" y="2" width="6" height="4" fill="#e0102b"/>
      <rect x="6" y="1" width="3" height="1" fill="#ff5a6e"/><rect x="5" y="2" width="2" height="1" fill="#ff5a6e"/><rect x="5" y="3" width="1" height="1" fill="#ff5a6e"/>
      <rect x="6" y="6" width="4" height="1" fill="#b00c22"/><rect x="10" y="4" width="1" height="2" fill="#b00c22"/>
      <rect x="4" y="10" width="8" height="1" fill="#ff5a6e"/>
      <rect x="3" y="11" width="10" height="4" fill="#e0102b"/>

  </a>
</nav>

<script type="module" src="/js/home.js"></script>
</body>
</html>
