<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUKU — Fullstack user centricity designer</title>
<meta name="description" content="FUKU — portafolio de Jean Carlo Fukuda Miyasato, fullstack user centricity designer.">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/app-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="site site--home">

<!-- fondo: los videos del proyecto en semitono (js/dither.js) -->
<canvas class="stage" id="stage" aria-hidden="true"></canvas>
<div class="stage-media" id="stage-media" hidden aria-hidden="true"></div>
<!-- videos de YouTube: su reproductor de fondo, con la trama de puntos encima -->
<div class="stage-yt" id="stage-yt" hidden aria-hidden="true"><div id="yt-player"></div></div>
<div class="stage-shade" aria-hidden="true"></div>

<a class="brand" href="/" aria-label="FUKU — fullstack user centricity designer">
  <b>FUKU</b>
  <small>Fullstack user centricity designer</small>
</a>

<div class="top-actions">
  <a class="round-btn" id="mail" href="mailto:fukuda.miyasato@gmail.com" aria-label="Escríbeme un correo" title="Correo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3.8 7l8.2 6 8.2-6"/>
    </svg>
  </a>
  <button class="round-btn sound-btn" id="sound" type="button" aria-pressed="true" aria-label="Apagar el sonido" title="Sonido">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
      <path class="s-off" d="M16 9.5l5 5M21 9.5l-5 5"/>
      <path class="s-on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/>
    </svg>
  </button>
  <!-- los navegadores no dejan sonar antes de que toques algo: este aviso se va con el primer toque -->
  <p class="sound-hint" id="sound-hint" hidden>Toca la pantalla para escuchar</p>
</div>

<!-- el proyecto que se ve: dos cuadrados, «qué es» y «qué hice» -->
<main class="folio" aria-live="polite">
  <article class="pcard" id="pcard" aria-roledescription="proyecto">
    <section class="pbox fx" id="pb-what">
      <header class="pbox-head">
        <h2 class="pbox-label">Qué es</h2>
        <p class="pcard-meta"><span id="pc-year"></span><span id="pc-name"></span></p>
      </header>
      <p class="pbox-text" id="pc-what"></p>
    </section>
    <section class="pbox fx" id="pb-did">
      <header class="pbox-head"><h2 class="pbox-label">Qué hice</h2></header>
      <p class="pbox-text" id="pc-did"></p>
      <ul class="pcard-tags" id="pc-tags"></ul>
    </section>
  </article>
</main>

<!-- apagar el sonido: se confirma -->
<dialog class="sound-dialog" id="sound-dialog" aria-labelledby="sound-dialog-title">
  <form method="dialog">
    <p class="sound-dialog-title" id="sound-dialog-title">Esta experiencia es con audio</p>
    <p>¿Seguro que quieres apagarlo?</p>
    <div class="sound-dialog-actions">
      <button value="off" type="submit" class="sd-off">Apagar</button>
      <button value="keep" type="submit" class="sd-keep" autofocus>Continuar</button>
    </div>
  </form>
</dialog>

<script type="module" src="/js/home.js"></script>
</body>
</html>
